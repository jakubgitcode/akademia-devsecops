name: 'CI — Quality Gates (lint + security)'

# ==================================================
# Gate 1: Jakość kodu (fmt, validate, tflint)
# Gate 2: Bezpieczeństwo (Trivy)
# Uruchamia się na KAŻDYM PR do main.
# ==================================================

on:
  pull_request:
    branches: [main]
    paths:
      - 'przyklad_blok4/infra/**'
      - 'przyklad_blok4/.tflint.hcl'

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_WORKING_DIR: ./przyklad_blok4/infra

jobs:
  # ==========================================
  # Gate 1: Jakość kodu
  # ==========================================
  format:
    name: '🎨 Format Check'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        id: fmt
        run: terraform fmt -check -recursive -diff ${{ env.TF_WORKING_DIR }}

      - name: Format Summary
        if: failure()
        run: |
          echo "## ❌ Format Check Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Uruchom \`terraform fmt -recursive .\` i commitnij poprawki." >> $GITHUB_STEP_SUMMARY

  validate:
    name: '✅ Validate'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./przyklad_blok4/infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init (offline)
        run: terraform init -backend=false

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Validate Summary
        if: always()
        run: |
          echo "## ✅ Terraform Validate" >> $GITHUB_STEP_SUMMARY
          echo "Status: **${{ steps.validate.outcome }}**" >> $GITHUB_STEP_SUMMARY

  tflint:
    name: '🔍 TFLint'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./przyklad_blok4/infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init (for provider schemas)
        run: terraform init -backend=false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: TFLint Init
        run: tflint --init
        working-directory: ./przyklad_blok4
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: TFLint Run
        id: tflint
        run: tflint --format compact --force
        working-directory: ./przyklad_blok4

      - name: TFLint Summary
        if: always()
        run: |
          echo "## 🔍 TFLint Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cd .. && tflint --format compact --force 2>&1 || true >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # Gate 2: Bezpieczeństwo
  # ==========================================
  trivy:
    name: '🛡️ Trivy Security Scan'
    runs-on: ubuntu-latest
    needs: [format, validate]
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy (IaC scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: './przyklad_blok4/infra'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          trivyignores: './przyklad_blok4/.trivyignore'

      - name: Trivy SARIF (for PR annotation)
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: './przyklad_blok4/infra'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'MEDIUM,HIGH,CRITICAL'

      - name: Security Summary
        if: always()
        run: |
          echo "## 🛡️ Security Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Trivy scanned: \`przyklad_blok4/infra/\`" >> $GITHUB_STEP_SUMMARY
          echo "Severity filter: HIGH, CRITICAL" >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # Podsumowanie — komentarz na PR
  # ==========================================
  summary:
    name: '📋 PR Summary'
    runs-on: ubuntu-latest
    needs: [format, validate, tflint, trivy]
    if: always()
    steps:
      - name: Quality Gates Summary
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = {
              'Format': '${{ needs.format.result }}',
              'Validate': '${{ needs.validate.result }}',
              'TFLint': '${{ needs.tflint.result }}',
              'Trivy': '${{ needs.trivy.result }}',
            };

            const icon = (s) => s === 'success' ? '✅' : s === 'skipped' ? '⏭️' : '❌';
            const rows = Object.entries(jobs)
              .map(([name, status]) => `| ${name} | ${icon(status)} ${status} |`)
              .join('\n');

            const allPassed = Object.values(jobs).every(s => s === 'success');
            const header = allPassed
              ? '## ✅ Quality Gates — ALL PASSED'
              : '## ❌ Quality Gates — FAILED';

            const body = [
              header,
              '',
              '| Gate | Status |',
              '|------|--------|',
              rows,
              '',
              allPassed
                ? '> Wszystkie bramy jakości przeszły. Można przejść do review i merge.'
                : '> Proszę poprawić błędy przed merge.',
            ].join('\n');

            // Update or create comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '## ✅ Quality Gates';
            const markerFail = '## ❌ Quality Gates';
            const existing = comments.data.find(
              c => c.body.includes(marker) || c.body.includes(markerFail)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
