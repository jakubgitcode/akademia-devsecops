apiVersion: apps/v1
kind: Deployment
metadata:
  name: akademia-devsecops
  labels:
    app: akademia-devsecops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: akademia-devsecops
  template:
    metadata:
      labels:
        app: akademia-devsecops
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: akademia-devsecops:latest
          ports:
            - containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: "500m"
              memory: "128Mi"
            requests:
              cpu: "100m"
              memory: "64Mi"
