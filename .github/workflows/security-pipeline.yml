name: Security Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  pull-requests: write
  issues: write

jobs:
  # Job 1: Secrets scanning
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 2: SAST
  sast:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan
        run: |
          semgrep scan \
            --config auto \
            --config .semgrep/ \
            --sarif \
            --output semgrep.sarif \
            --severity ERROR \
            .
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif

  # Job 3: Dependency scan
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy dependency scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-deps.sarif'
          severity: 'HIGH,CRITICAL'
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-deps.sarif

  # Job 4: Container scan
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t myapp:security-test .
      - name: Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'myapp:security-test'
          format: 'sarif'
          output: 'trivy-image.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          scanners: 'vuln'
          trivyignores: '.trivyignore'
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-image.sarif

  # Job 5: IaC scan
  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy IaC scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'k8s/'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

  # Job 6: DAST
  dast:
    runs-on: ubuntu-latest
    steps:
      - name: Start Juice Shop
        run: |
          docker run -d --name juice-shop -p 3000:3000 bkimminich/juice-shop
          sleep 15
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:3000'
          fail_action: false
          artifact_name: zap-report
          create_issue: false
      - name: Stop Juice Shop
        if: always()
        run: docker stop juice-shop && docker rm juice-shop

  # Summary job
  security-gate:
    needs: [secrets, sast, dependencies, container, iac, dast]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Security Gate
        run: |
          echo "=== Security Pipeline Results ==="
          echo "Secrets:      ${{ needs.secrets.result }}"
          echo "SAST:         ${{ needs.sast.result }}"
          echo "Dependencies: ${{ needs.dependencies.result }}"
          echo "Container:    ${{ needs.container.result }}"
          echo "IaC:          ${{ needs.iac.result }}"
          echo "DAST:         ${{ needs.dast.result }}"

          if [ "${{ needs.secrets.result }}" = "failure" ] || \
             [ "${{ needs.container.result }}" = "failure" ] || \
             [ "${{ needs.iac.result }}" = "failure" ] || \
             [ "${{ needs.dast.result }}" = "failure" ]; then
            echo "SECURITY GATE: FAILED - blocking merge"
            exit 1
          fi

          echo "SECURITY GATE: PASSED"

  # Report job
  report:
    needs: [secrets, sast, dependencies, container, iac, dast]
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Comment PR with security results
        uses: actions/github-script@v7
        with:
          script: |
            const r = {
              secrets:      '${{ needs.secrets.result }}',
              sast:         '${{ needs.sast.result }}',
              dependencies: '${{ needs.dependencies.result }}',
              container:    '${{ needs.container.result }}',
              iac:          '${{ needs.iac.result }}',
              dast:         '${{ needs.dast.result }}',
            };
            const icon = (s) => s === 'success' ? '✅' : s === 'failure' ? '❌' : '⚠️';
            const blocked = ['secrets', 'container', 'iac', 'dast'].some(j => r[j] === 'failure');
            const body = [
              '## 🔒 Security Pipeline Report',
              '',
              '| Scanner | Status |',
              '|---------|--------|',
              `| Secrets (Gitleaks) | ${icon(r.secrets)} ${r.secrets} |`,
              `| SAST (Semgrep) | ${icon(r.sast)} ${r.sast} |`,
              `| SCA (Trivy FS) | ${icon(r.dependencies)} ${r.dependencies} |`,
              `| Container (Trivy Image) | ${icon(r.container)} ${r.container} |`,
              `| IaC (Trivy Config) | ${icon(r.iac)} ${r.iac} |`,
              `| DAST (ZAP Baseline) | ${icon(r.dast)} ${r.dast} |`,
              '',
              blocked
                ? '> ⛔ **MERGE BLOCKED** — critical security findings detected. Fix all ❌ before merging.'
                : '> ✅ All security checks passed — safe to merge.',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
