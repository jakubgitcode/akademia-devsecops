name: Multi-Environment Deploy

on:
  # push:
  #   branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: echo "value=1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
      - run: echo "Built version ${{ steps.ver.outputs.value }}"

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://dev.example.com
    steps:
      - run: |
          echo "Deploying ${{ needs.build.outputs.version }} to development"
          echo "Deploy complete"
          echo "Moja zmienna środowiskowa: ${{ vars.MY_ENV_VAR }}"

  deploy-staging:
    needs: [build, deploy-dev]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.example.com
    steps:
      - run: |
          echo "Deploying ${{ needs.build.outputs.version }} to staging"
          echo "Running smoke tests..."
          echo "Smoke tests passed"

  deploy-production:
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://example.com
    steps:
      - run: |
          echo "Deploying ${{ needs.build.outputs.version }} to production"
          echo "Production deploy complete"
