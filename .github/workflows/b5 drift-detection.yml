name: 'b5 Drift Detection (cron)'

on:
  schedule:
    - cron: '0 6 * * 1-5'    # Pon-Pt o 6:00 UTC
  workflow_dispatch:           # Ręczne uruchomienie do testów
    inputs:
      environment:
        description: 'Środowisko do sprawdzenia'
        required: true
        default: 'prod'
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read
  issues: write               # Do tworzenia GitHub Issues

env:
  ARM_CLIENT_ID: "${{ secrets.ARM_CLIENT_ID }}"
  ARM_SUBSCRIPTION_ID: "${{ secrets.ARM_SUBSCRIPTION_ID }}"
  ARM_TENANT_ID: "${{ secrets.ARM_TENANT_ID }}"
  ARM_USE_OIDC: "true"
  TF_WORKING_DIR: ./przyklad_blok5/infra
  # Domyślne środowisko dla cron (prod)
  TARGET_ENV: "${{ github.event.inputs.environment || 'prod' }}"

jobs:
  detect-drift:
    name: 'Detect Drift (${{ github.event.inputs.environment || ''prod'' }})'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./przyklad_blok5/infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false    # Ważne! Wrapper maskuje exit codes

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan (detect drift)
        id: plan
        run: |
          set +e
          terraform plan \
            -detailed-exitcode \
            -no-color \
            -var-file=environments/${{ env.TARGET_ENV }}.tfvars \
            -out=drift.tfplan \
            2>&1 | tee plan_output.txt
          PLAN_EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=${PLAN_EXIT_CODE}" >> "$GITHUB_OUTPUT"

          if [ $PLAN_EXIT_CODE -eq 0 ]; then
            echo "drift_status=NO_DRIFT" >> "$GITHUB_OUTPUT"
            echo "✅ Brak driftu — infrastruktura zgodna z kodem."
          elif [ $PLAN_EXIT_CODE -eq 2 ]; then
            echo "drift_status=DRIFT_DETECTED" >> "$GITHUB_OUTPUT"
            echo "⚠️ DRIFT WYKRYTY — infrastruktura odbiega od kodu!"
          else
            echo "drift_status=ERROR" >> "$GITHUB_OUTPUT"
            echo "❌ Błąd konfiguracji Terraform."
            exit 1
          fi

      # --- Raport w Job Summary ---
      - name: Generate Job Summary
        if: always()
        run: |
          echo "## 🔍 Drift Detection Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parametr | Wartość |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Data | $(date -u '+%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "| Środowisko | \`${{ env.TARGET_ENV }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | **${{ steps.plan.outputs.drift_status }}** |" >> $GITHUB_STEP_SUMMARY
          echo "| Exit Code | \`${{ steps.plan.outputs.exit_code }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.plan.outputs.exit_code }}" = "2" ]; then
            echo "### Wykryte zmiany" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E '^\s*(#|~|\+|-|Plan:)' plan_output.txt >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      # --- Upload artifact z planem ---
      - name: Upload drift report
        if: steps.plan.outputs.exit_code == '2'
        uses: actions/upload-artifact@v4
        with:
          name: drift-report-${{ env.TARGET_ENV }}-${{ github.run_number }}
          path: |
            przyklad_blok5/infra/plan_output.txt
          retention-days: 30

      # --- Automatyczne tworzenie Issue ---
      - name: Create GitHub Issue on Drift
        if: steps.plan.outputs.exit_code == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync(
              'przyklad_blok5/infra/plan_output.txt', 'utf8'
            );

            // Wyciągnij podsumowanie planu
            const planSummary = planOutput
              .split('\n')
              .filter(l => l.match(/Plan:|#|~ |(\+|-)\s/))
              .slice(0, 30)
              .join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Drift wykryty w środowisku: ${{ env.TARGET_ENV }}`,
              labels: ['drift', 'priority:high', 'automated'],
              body: [
                `## Drift Detection Alert`,
                ``,
                `**Data:** ${new Date().toISOString()}`,
                `**Środowisko:** \`${{ env.TARGET_ENV }}\``,
                `**Workflow Run:** [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                ``,
                `### Plan Summary`,
                '```',
                planSummary || 'Brak szczegółów — sprawdź artifact.',
                '```',
                ``,
                `### Następne kroki`,
                `1. Sprawdź zmiany w [artifact](#) tego workflow.`,
                `2. Zdecyduj:`,
                `   - **Enforce code**: \`terraform apply\` — jeśli drift nieautoryzowany.`,
                `   - **Accept drift**: uaktualnij kod via PR — jeśli zmiana celowa.`,
                `   - **Ignore**: dodaj \`lifecycle { ignore_changes }\` — jeśli platform-managed.`,
              ].join('\n'),
            });
