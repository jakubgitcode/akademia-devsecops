name: Secure Pipeline OIDC

on:
  push:
    branches: [main]
  pull_request:

# Globalne minimum permissions
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    # Nie potrzebuje dodatkowych permissions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write    # potrzebne do SARIF upload
    steps:
      - uses: actions/checkout@v4
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'sarif'
          output: 'trivy.sarif'
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif

  build-and-push:
    needs: [lint, test, security-scan]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write    # potrzebne do push GHCR
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

  # Przyklad OIDC z AWS (wymaga konfiguracji IAM)
  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write    # potrzebne do OIDC
    environment: staging
    steps:
      - name: Debug OIDC token
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo $TOKEN | cut -d. -f2 | base64 -d 2>/dev/null | python3 -m json.tool

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::394407950342:role/gh-web-id
          aws-region: eu-central-1

      - name: Verify credentials
        run: aws sts get-caller-identity

      - name: OIDC Demo (dry-run)
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_SHA: ${{ github.sha }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          echo "=== OIDC Configuration ==="
          echo "In production, this job would:"
          echo "1. Request OIDC token from GitHub"
          echo "2. Exchange token for AWS temporary credentials"
          echo "3. Deploy using temporary credentials (15 min TTL)"
          echo ""
          echo "Required AWS setup:"
          echo "- IAM Identity Provider (GitHub OIDC)"
          echo "- IAM Role with trust policy for this repo"
          echo "- Role permissions: only what's needed for deploy"
          echo ""
          echo "GitHub context:"
          echo "  Repository: $GH_REPOSITORY"
          echo "  Branch: $GH_REF_NAME"
          echo "  SHA: $GH_SHA"
          echo "  Actor: $GH_ACTOR"
